# Production-style setup: separate web, scheduler and SMTP services from the same
# image, backed by MariaDB.
#
#   cp .env.docker.example .env.docker   # set APP_KEY, APP_URL, DB_PASSWORD, DMARC_SMTP_ALLOWED_IPS
#   docker compose --env-file .env.docker -f compose.split.yaml up -d --build
#
# Every variable in .env.docker reaches the containers as an environment variable
# (--env-file additionally lets this file reference them, e.g. DB_PASSWORD); the
# `environment` entries below only wire the services together.
# Put a reverse proxy (Caddy, Traefik, nginx) in front of `web` for HTTPS and set
# TRUSTED_PROXIES in .env.docker.

name: dmarc-monitor

x-app: &app
  image: burnacid/dmarc-monitor:latest
  build: .
  restart: unless-stopped
  env_file: .env.docker
  environment: &app-environment
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-dmarc}
    DB_USERNAME: ${DB_USERNAME:-dmarc}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
    RUN_MIGRATIONS: "false"
  volumes:
    - storage:/app/storage
  depends_on:
    db:
      condition: service_healthy

services:
  web:
    <<: *app
    command: web
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "true"
    ports:
      - "8080:8080"

  scheduler:
    <<: *app
    command: scheduler
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy

  smtp:
    <<: *app
    command: smtp
    # Exits immediately unless DMARC_SMTP_ENABLED=true in .env.docker.
    restart: on-failure
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy
    ports:
      # Port the relay/forwarder delivers to. Restrict who may connect with
      # DMARC_SMTP_ALLOWED_IPS in .env.docker, and keep this off the public internet.
      - "${DMARC_SMTP_PUBLISHED_PORT:-2525}:2525"
    # Optional STARTTLS certificate (then set DMARC_SMTP_TLS_CERT/KEY in .env.docker):
    # volumes:
    #   - storage:/app/storage
    #   - ./certs:/certs:ro

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-dmarc}
      MARIADB_USER: ${DB_USERNAME:-dmarc}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  storage:
  db:
