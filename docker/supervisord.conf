[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:web]
command=frankenphp run --config /etc/frankenphp/Caddyfile --adapter caddyfile
directory=/app
autorestart=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:scheduler]
command=php artisan schedule:work
directory=/app
autorestart=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:smtp]
command=php artisan dmarc:smtp-serve
directory=/app
autostart=%(ENV_DMARC_SMTP_ENABLED)s
autorestart=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
